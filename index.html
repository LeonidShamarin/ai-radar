      <h1>Про проєкт</h1>
      <p><strong>AI Radar</strong> це каталог нових AI-продуктів, які щойно з'явились у мережі. Дані бере з публічного API <a href="https://freeserp.ai/docs.php" target="_blank" rel="noopener">FreeSerp</a> (індекс <code>sites</code>: головні сторінки сайтів з LLM-описом, Domain Rating, нішею і датою, коли сайт уперше відповів).</p>

      <h2>Мета</h2>
      <ul>
        <li>За хвилину знайти нові AI-продукти в потрібній ніші.</li>
        <li>Порівняти 2-4 сайти поруч: ніша, авторитет, стек, дата запуску, опис.</li>
        <li>Поділитися будь-якою вибіркою: фільтри і список порівняння живуть в URL.</li>
      </ul>

      <h2>Для кого</h2>
      <ul>
        <li><strong>Засновники і продакт-менеджери:</strong> хто з'явився в моїй ніші за останній місяць.</li>
        <li><strong>Маркетологи і SEO-фахівці:</strong> нові сайти з DR вище N, потенційні партнери.</li>
        <li><strong>Інвестори і скаути:</strong> свіжі AI-стартапи без шуму з магазинів і каталогів.</li>
        <li><strong>Розробники:</strong> на чому збирають нові AI-продукти (Lovable, v0, Next.js).</li>
      </ul>

      <h2>Сторінки</h2>
      <div class="table-wrap">
      <table class="facts">
        <thead><tr><th>Сторінка</th><th>Що на ній</th></tr></thead>
        <tbody>
          <tr><td><a href="#/">Огляд</a></td><td>Цифри індексу, ніші з кількістю сайтів, найновіші і найавторитетніші нові продукти.</td></tr>
          <tr><td><a href="#/catalog">Каталог</a></td><td>Пошук, фільтри (ніша, стек, DR, дата запуску, сортування), пагінація.</td></tr>
          <tr><td>Профіль сайту</td><td>Опис, усі поля з індексу, посилання на сайт, схожі сайти з тієї ж ніші.</td></tr>
          <tr><td><a href="#/compare">Порівняння</a></td><td>До 4 сайтів у таблиці, посилання на порівняння можна скопіювати.</td></tr>
        </tbody>
      </table>
      </div>

      <h2>Що варто знати про дані</h2>
      <ul>
        <li>Індекс AI-стартапів оновлюється із запізненням: найсвіжіша дата запуску в ньому може бути на кілька тижнів раніше за сьогодні. Тому фільтр «за 7 днів» рахується від найсвіжішої дати в даних, а не від календаря.</li>
        <li>«Вперше відповів» (<code>went_live</code>) це дата, коли робот FreeSerp уперше побачив сайт живим, а не офіційний запуск продукту.</li>
        <li>У нових доменів Domain Rating часто ще не пораховано, тоді показуємо «н/д».</li>
        <li>За замовчуванням увімкнено фільтр <code>ai_startups=1</code>: він прибирає магазини, каталоги й казино, які просто згадують AI. Його можна вимкнути в каталозі.</li>
      </ul>
